# Bunny Blaster 9000 - main app config.
# Paths are relative to the repo root (loaded via scripts/bb9k.py).

camera:
  calib_file: data/camera_calib.yaml   # intrinsics (camera_matrix, dist_coeffs) - see scripts/calibrate_camera.py
#  height_m: 1.8288                    # camera height above the ground (6 ft) - height_ft wins if set
  height_ft: 3.25                      # camera height above the ground, in feet
  pitch_deg: 0.0                       # 0 = looking straight ahead, horizontally
  roll_deg:  0.0                       # 0 = camera level, not rotated
  #resolution: "MODE_2592_1944"         # bbnk.camera.Resolution member: MODE_640_480, MODE_1296_972, MODE_1920_1080, MODE_2592_1944
  #resolution: "MODE_1296_972"         # bbnk.camera.Resolution member: MODE_640_480, MODE_1296_972, MODE_1920_1080, MODE_2592_1944
  resolution: "MODE_640_480"           # bbnk.camera.Resolution member: MODE_640_480, MODE_1296_972, MODE_1920_1080, MODE_2592_1944
  auto_exposure: True                  # ensure correct brightness/contrast of images by applying sw isp functions
  auto_gamma: 1.8                      # for auto-exposure, gamma value to apply

blaster:
  yaw_servo:
    gpio_pin: 18
    pwm_hz: 80
    min_pulse_us: 600
    max_pulse_us: 2400
    min_angle_deg: 0
    max_angle_deg: 270
  pitch_servo:
    gpio_pin: 12
    pwm_hz: 80
    min_pulse_us: 600
    max_pulse_us: 2400
    min_angle_deg: 0
    max_angle_deg: 270
  solenoid_gpio_pin: 15
  water_velocity_mps: 7
  yaw_invert: true                     # servo turns left on positive angles - needs invert
  pitch_invert: false                  # servo goes up on positive angles - already correct
  yaw_zero_offset_deg: 125             # raw yaw servo angle = world yaw 0 (straight ahead)
  pitch_zero_offset_deg: 130           # raw pitch servo angle = world pitch 0 (level)

yolo:
  model_name: data/combined_domestic.pt
  score_thresh: 0.25

motion:
  width: 320                   # small working frame motion detection runs on (subsampled from the full camera frame)
  height: 240
  diff_thresh: 25               # static floor on the per-pixel abs-diff (0-255) threshold - actual threshold is max(diff_thresh, noise_multiplier * noise_floor)
  noise_window_s: 10.0           # IIR time constant (seconds) for the noise_floor estimate - adapts the threshold to noisier conditions (e.g. nighttime sensor noise)
  noise_multiplier: 2.0          # dynamic threshold = this many x noise_floor
  gap_span: 5                   # closes (dilate+erode) gaps up to ~this many small-frame px before cc analysis, so nearby blobs merge into one region - 0 disables
  min_area: 500                 # min connected-component area, in small-frame px (post gap_span close), to count as a motion region - filters out noise

log:
  event_log_file: data/logs/events.jsonl   # jsonl record of each fire event - one file per day, e.g. events_2026_08_29.jsonl, new file each midnight
  event_log_max_bytes: 1073741824          # cap on the total size of all dated event log files (1 GiB) - oldest whole files deleted past this
  event_log_prune_fraction: 0.25           # once over the cap, free this fraction of event_log_max_bytes in one pass
  image_dir: data/logs/images              # frame saved alongside each fire event
  image_max_bytes: 1073741824              # cap on image_dir's total size (1 GiB) - oldest images pruned past this
  image_prune_fraction: 0.25               # once over the cap, free this fraction of image_max_bytes in one pass
  labeled_image_dir: logs/labeled                  # same frame, annotated (boxes/labels drawn on), saved alongside each fire event
  labeled_image_max_bytes: 1073741824              # cap on labeled_image_dir's total size (1 GiB) - oldest images pruned past this
  labeled_image_prune_fraction: 0.25               # once over the cap, free this fraction of labeled_image_max_bytes in one pass
