# Bunny Blaster 9000 - main app config.
# Paths are relative to the repo root (loaded via scripts/bb9k.py).

camera:
  calib_file: data/camera_calib.yaml   # intrinsics (camera_matrix, dist_coeffs) - see scripts/calibrate_camera.py
#  height_m: 1.8288                    # camera height above the ground (6 ft) - height_ft wins if set
  height_ft: 3.25                      # camera height above the ground, in feet
  pitch_deg: 0.0                       # 0 = looking straight ahead, horizontally
  roll_deg:  0.0                       # 0 = camera level, not rotated
  resolution: "MODE_2592_1944"         # bbnk.camera.Resolution member: MODE_640_480, MODE_1296_972, MODE_1920_1080, MODE_2592_1944
  #resolution: "MODE_640_480"           # bbnk.camera.Resolution member: MODE_640_480, MODE_1296_972, MODE_1920_1080, MODE_2592_1944
  auto_exposure: True                  # ensure correct brightness/contrast of images by applying sw isp functions
  auto_gamma: 2.2                      # for auto-exposure, gamma value to apply

blaster:
  yaw_servo:
    gpio_pin: 18
    pwm_hz: 80
    min_pulse_us: 600
    max_pulse_us: 2400
    min_angle_deg: 0
    max_angle_deg: 270
  pitch_servo:
    gpio_pin: 12
    pwm_hz: 80
    min_pulse_us: 600
    max_pulse_us: 2400
    min_angle_deg: 0
    max_angle_deg: 270
  solenoid_gpio_pin: 15
  water_velocity_mps: 7
  yaw_invert: true                     # servo turns left on positive angles - needs invert
  pitch_invert: false                  # servo goes up on positive angles - already correct
  yaw_zero_offset_deg: 125             # raw yaw servo angle = world yaw 0 (straight ahead)
  pitch_zero_offset_deg: 130           # raw pitch servo angle = world pitch 0 (level)

yolo:
  model_name: data/combined_domestic.pt
  score_thresh: 0.1

log:
  event_log_file: data/logs/events.jsonl   # jsonl record of each fire event (detection/aim/result data)
  image_dir: data/logs/images              # frame saved alongside each fire event
  image_max_bytes: 1073741824              # cap on image_dir's total size (1 GiB) - oldest images pruned past this
  image_prune_fraction: 0.25               # once over the cap, free this fraction of image_max_bytes in one pass
